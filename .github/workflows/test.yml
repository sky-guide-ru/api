name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: api
      - uses: actions/checkout@v4
        with:
          repository: sky-guide-ru/web
          path: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: api
      - run: npm test
        working-directory: api
  docker:
    # Образ сервера собирается и отвечает на /healthz (так его запускает deploy).
    # Ловит то, чего не видят тесты: например, зависимость, которая не ставится внутри образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sky-guide-api .
      - run: |
          docker run -d --name api -e PLAYER=Steve sky-guide-api
          for i in $(seq 1 60); do
            if docker exec api node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
