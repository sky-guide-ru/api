openapi: 3.1.0
info:
  title: Sky Guide API
  version: 1.4.0
  summary: Предметы, рынок и расчёты по Hypixel SkyBlock на русском и английском
  description: |
    Открытый API сайта [sky-guide.ru](https://sky-guide.ru). Все ответы — расчёты и переводы Sky Guide,
    а не пересказ ответа Hypixel.

    **Без ключа** открыты предметы и их картинки, поиск, Bazaar, аукцион, свечи, цены и тренды, флипы, календарь и мэр,
    лидерборды, гайды, словарь терминов, новости и статус.
    Лимит — 120 запросов в минуту с одного адреса.

    **Данные игроков** (`/v1/players/...` и `/v1/compare`) — только собственным клиентам Sky Guide (бот и мод самого
    сайта): ключ в заголовке `X-API-Key` с отметкой «данные игроков», её ставит только владелец сайта. Сторонним
    разработчикам такие ключи не выдаются: правила API Hypixel запрещают передавать данные их API другим.
    Ключ без отметки получает на этих ручках 403 `NO_SCOPE`. Ключи выдаёт владелец сайта, у каждого свой лимит в минуту.

    **Условия** ([API и правила](https://sky-guide.ru/api-terms), [API terms](https://sky-guide.ru/en/api-terms)):
    рядом с данными — видимая подпись «Данные: Sky Guide» со ссылкой на https://sky-guide.ru; нельзя перепродавать
    данные и доступ; платные функции на основе API — только с разрешения владельца; за нарушения ключ отзывается.
    Каждый ответ несёт заголовки `X-Attribution` и `Link: </api-terms>; rel="terms-of-service"`.

    **Язык.** По умолчанию русский; английский — `?lang=en` или заголовок `X-Lang: en`.
    Игровые названия (предметы, скиллы, острова) в обоих языках английские, как в игре.

    **Ошибки** приходят в одном виде: `{ "error": "текст", "code": "КОД" }`.
    Ломающие изменения — только в `/v2`; `/v1` после этого живёт с пометкой deprecated.
  termsOfService: https://sky-guide.ru/api-terms
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: Sky Guide
    url: https://github.com/sky-guide-ru/api
servers:
  - url: https://sky-guide.ru
    description: sky-guide.ru
  - url: /
    description: этот сервер
tags:
  - name: Предметы
  - name: Рынок
  - name: Справка
  - name: Игроки
    description: Только собственным клиентам Sky Guide — ключ `X-API-Key` с отметкой «данные игроков».

paths:
  /v1/version:
    get:
      tags: [Справка]
      operationId: getVersion
      summary: Версия API и сборки
      responses:
        '200':
          description: Версии
          headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimit' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/status:
    get:
      tags: [Справка]
      operationId: getStatus
      summary: Нагрузка сервера и свежесть цен
      responses:
        '200':
          description: Статус
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/items/{id}:
    get:
      tags: [Предметы]
      operationId: getItem
      summary: Карточка предмета
      description: |
        Описание (как в игре и в переводе), рецепты, цены Bazaar и аукциона, цена у NPC, где используется,
        свойства и русская справка (`ru`). Понимает id книг с Bazaar (`ENCHANTMENT_SHARPNESS_7`) и NEU (`SHARPNESS;7`).
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: lvl
          in: query
          description: Уровень питомца для чисел в описании (1–200, по умолчанию 100)
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/items/{id}/obtain:
    get:
      tags: [Предметы]
      operationId: getItemObtain
      summary: Как получить предмет
      description: Способы получения по шагам — NPC, крафт с деревом ингредиентов и ценами, Forge, Kat, дропы — и ссылка на вики.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Способы получения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObtainGuide' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/search:
    get:
      tags: [Предметы]
      operationId: searchItems
      summary: Поиск предметов
      description: Понимает английские и русские названия, транслит и жаргон («гиперион», «терма», «аоте»).
      parameters:
        - name: q
          in: query
          required: true
          description: Запрос, от 2 символов
          schema: { type: string, minLength: 2, maxLength: 80 }
          example: гиперион
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Найденные предметы, самые похожие первыми
          content:
            application/json:
              schema:
                type: object
                required: [query, items]
                properties:
                  query: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/bazaar:
    get:
      tags: [Рынок]
      operationId: listBazaar
      summary: Товары Bazaar
      description: Все товары Bazaar с ценами, оборотом за неделю и изменением за сутки. Поиск, фильтр по категории, сортировка, страницы.
      parameters:
        - $ref: '#/components/parameters/ListQuery'
        - name: sort
          in: query
          description: 'Сортировка `ключ:направление` (1 — по возрастанию, -1 — по убыванию). Ключи: vol, d1, buy, spreadPct, buyWeek, name'
          schema: { type: string, example: 'buy:-1' }
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer, description: Сколько всего найдено (без offset/limit) }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BazaarRow' }
                  facets: { $ref: '#/components/schemas/Facets' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/auctions:
    get:
      tags: [Рынок]
      operationId: listAuctions
      summary: Предметы аукциона
      description: Lowest BIN, продажи за сутки и неделю, медиана продаж и изменение за сутки. С `ids` — ещё и варианты (звёзды, Recomb, редкость питомца).
      parameters:
        - $ref: '#/components/parameters/ListQuery'
        - name: sort
          in: query
          description: 'Сортировка `ключ:направление`, как у /v1/bazaar'
          schema: { type: string }
        - $ref: '#/components/parameters/Category'
        - name: rarity
          in: query
          description: Только эта редкость
          schema: { type: string, example: LEGENDARY }
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuctionRow' }
                  facets: { $ref: '#/components/schemas/Facets' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/market/candles/{id}:
    get:
      tags: [Рынок]
      operationId: getCandles
      summary: Свечи цены
      description: История цены свечами (OHLC и объём). Bazaar — с 1 минуты, аукцион — с 5 минут. Свечи 5м/1ч хранятся 30 дней, дневные дольше.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: market
          in: query
          schema: { type: string, enum: [bazaar, ah], default: bazaar }
        - name: tf
          in: query
          description: Размер свечи
          schema: { type: string, enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w, 1M], default: 1h }
        - name: limit
          in: query
          schema: { type: integer, minimum: 10, maximum: 3000, default: 500 }
        - name: to
          in: query
          description: Свечи до этого времени (мс с 1970), для подгрузки истории
          schema: { type: integer }
      responses:
        '200':
          description: Свечи, старые первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candles' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/flips/{kind}:
    get:
      tags: [Рынок]
      operationId: getFlips
      summary: Флипы
      description: |
        Выгодные перепродажи по текущим ценам: `bazaar` — заказ на покупку и продажу на Bazaar,
        `craft` — купить ингредиенты и скрафтить, `forge` — Forge в Dwarven Mines, `npc` — купить на Bazaar и продать NPC,
        `snipes` — лоты аукциона заметно дешевле обычной цены продажи.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [bazaar, craft, forge, npc, snipes] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 40 }
        - name: max
          in: query
          description: Только для bazaar и snipes — не дороже этой цены
          schema: { type: number }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Флипы, выгодные первыми
          content:
            application/json:
              schema:
                type: object
                required: [kind, items]
                properties:
                  kind: { type: string, enum: [bazaar, craft, forge, npc, snipes] }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Flip' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/refs/lexicon:
    get:
      tags: [Справка]
      operationId: getLexicon
      summary: Словарь игровых терминов
      description: |
        Фразы, которые сайт подсвечивает подсказками: предметы, книги чар, статы, скиллы, мэры, острова, Slayers, этажи, редкости.
        Ключ — фраза, значение — `тип:id` (`i:` предмет, `t:` термин).
      responses:
        '200':
          description: Словарь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lexicon' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/news:
    get:
      tags: [Справка]
      operationId: getNews
      summary: Новости сайта
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Записи, свежие первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/News' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/calendar:
    get:
      tags: [Справка]
      operationId: getCalendar
      summary: Календарь и мэр
      description: 'Мэр и министр сейчас, выборы, события SkyBlock по датам и чем они выгодны — как раздел «Календарь».'
      parameters:
        - name: year
          in: query
          description: Год SkyBlock (по умолчанию текущий)
          schema: { type: integer }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Календарь и мэр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Section' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/leaderboard:
    get:
      tags: [Справка]
      operationId: getLeaderboard
      summary: Лидерборды
      description: 'Игроки, которых открывали на сайте, по networth, скиллам, Catacombs, Slayers и другим таблицам. Список таблиц — в boards ответа.'
      parameters:
        - name: board
          in: query
          description: Таблица (id из boards ответа)
          schema: { type: string, default: networth }
        - name: mode
          in: query
          schema: { type: string, enum: [all, normal, ironman, other], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: find
          in: query
          description: Ник — найти место игрока
          schema: { type: string, maxLength: 36 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Лидерборды
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/guides:
    get:
      tags: [Справка]
      operationId: getGuides
      summary: Гайды
      description: 'Все гайды сайта по направлениям (Dungeons, Slayers, Kuudra, Rift, Fishing…) — общие, без привязки к профилю.'
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Гайды
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuideList' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/guides/{id}:
    get:
      tags: [Справка]
      operationId: getGuide
      summary: Гайд
      description: 'Гайд целиком: разделы, шаги, предметы и подсказки к терминам (refs).'
      parameters:
        - $ref: '#/components/parameters/GuideId'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Гайд
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Section' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/quotes:
    get:
      tags: [Рынок]
      operationId: getQuotes
      summary: Цены купить и продать
      description: 'Живые цены «купить сейчас / продать сейчас» для списка предметов (Bazaar или аукцион). Нет цены — null.'
      parameters:
        - name: ids
          in: query
          required: true
          description: SkyBlock ID через запятую (до 200)
          schema: { type: string, example: 'ENCHANTED_DIAMOND,HYPERION' }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Цены купить и продать
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: [object, 'null'], additionalProperties: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/market/trend/{id}:
    get:
      tags: [Рынок]
      operationId: getPriceTrend
      summary: Тренд цены
      description: 'Цена сейчас, изменение за сутки и неделю, минимум, максимум и медиана за 7 дней.'
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Тренд цены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trend' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/market/movers:
    get:
      tags: [Рынок]
      operationId: getMarketMovers
      summary: Лидеры роста и падения
      description: 'Предметы, которые сильнее всего подорожали и подешевели за сутки или неделю (только ходовые).'
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [d1, d7], default: d1 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Лидеры роста и падения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movers' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/market/crops:
    get:
      tags: [Рынок]
      operationId: getCropProfits
      summary: Доход с Farming
      description: 'Сколько монет в час дают культуры при заданном Farming Fortune — по ценам Bazaar и NPC.'
      parameters:
        - name: fortune
          in: query
          description: Farming Fortune
          schema: { type: number, minimum: 0, maximum: 5000 }
        - name: bps
          in: query
          description: Блоков в секунду
          schema: { type: number, minimum: 1, maximum: 40 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Доход с Farming
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/items/{id}/image:
    get:
      tags: [Предметы]
      operationId: getItemImage
      summary: Картинка предмета
      description: Иконка предмета в PNG (как на сайте), для карточек бота и мода.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }

  /v1/players/{name}/profiles:
    get:
      tags: [Игроки]
      operationId: getPlayerProfiles
      summary: Профили SkyBlock игрока
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Nick'
      responses:
        '200':
          description: Профили
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfiles' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoKey' }
        '403': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/players/{name}/profiles/{profile}/summary:
    get:
      tags: [Игроки]
      operationId: getPlayerSummary
      summary: Сводка профиля
      description: Скиллы, Slayers, Catacombs, networth, Magical Power, питомцы, снаряжение и первые шаги плана.
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Nick'
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoKey' }
        '403': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/players/{name}/profiles/{profile}/plan:
    get:
      tags: [Игроки]
      operationId: getPlayerPlan
      summary: План «Что делать»
      description: Шаги плана по важности — что улучшить, вкачать или купить дальше, зачем и как.
      security: [{ ApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Nick'
        - $ref: '#/components/parameters/Profile'
        - name: cat
          in: query
          description: Только шаги этого раздела (поле cat шага, без учёта регистра)
          schema: { type: string }
        - name: limit
          in: query
          description: Сколько первых шагов отдать
          schema: { type: integer, minimum: 1, maximum: 100 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: План
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoKey' }
        '403': { $ref: '#/components/responses/BadKey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Rate' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/players/{name}/profiles/{profile}/money:
    get:
      tags: [Игроки]
      operationId: getPlayerMoney
      summary: Способы заработка
