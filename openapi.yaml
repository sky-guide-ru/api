          description: Сравнение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoKey' }
        '403': { $ref: '#/components/responses/BadKey' }
        '429': { $ref: '#/components/responses/Rate' }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Ключ вида `sg_xxxxxxxxxx_…`. Выдаёт владелец сайта. Данные игроков — только ключам с отметкой «данные игроков» (собственные клиенты Sky Guide).

  headers:
    RateLimit:
      description: Сколько запросов в минуту можно (с ключом — лимит ключа)
      schema: { type: integer }

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: SkyBlock ID предмета (как в NEU и на Bazaar)
      schema: { type: string, pattern: '^[A-Za-z0-9_:;\-.]{1,80}$' }
      example: HYPERION
    Nick:
      name: name
      in: path
      required: true
      description: Ник Minecraft
      schema: { type: string, pattern: '^[A-Za-z0-9_]{1,16}$' }
    Profile:
      name: profile
      in: path
      required: true
      description: Название профиля (Apple, Banana…) или `selected` — тот, где игрок сейчас играет
      schema: { type: string, maxLength: 40 }
      example: selected
    GuideId:
      name: id
      in: path
      required: true
      description: id гайда (из списка гайдов)
      schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' }
      example: dungeons
    Lang:
      name: lang
      in: query
      description: Язык ответа (или заголовок X-Lang)
      schema: { type: string, enum: [ru, en], default: ru }
    ListQuery:
      name: q
      in: query
      description: Поиск по названию (английскому, русскому, жаргону) или id
      schema: { type: string, maxLength: 80 }
    Category:
      name: cat
      in: query
      description: Только эта категория (ключи — в facets.cat ответа)
      schema: { type: string, example: farming }
    Ids:
      name: ids
      in: query
      description: Конкретные товары через запятую (до 200) — без поиска и страниц
      schema: { type: string, example: 'ENCHANTED_DIAMOND,BOOSTER_COOKIE' }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Неверный параметр
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Не найдено (предмет, игрок, профиль), игрок попросил не показывать профиль (HIDDEN) или у профиля нет этих данных (NO_DATA)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NoKey:
      description: Нужен ключ API
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadKey:
      description: Неверный или отозванный ключ (BAD_KEY, REVOKED) или ключ без доступа к данным игроков (NO_SCOPE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Rate:
      description: Превышен лимит запросов; Retry-After — через сколько секунд можно снова
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Профиль ещё загружается (LOADING) или Hypixel сейчас не отвечает (HYPIXEL_LIMIT, HYPIXEL_UNAVAILABLE) — повтори позже
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Понятный текст ошибки }
        code:
          type: string
          enum: [BAD_ID, BAD_QUERY, BAD_NAME, NOT_FOUND, NO_PROFILE, HIDDEN, NO_DATA, NO_KEY, BAD_KEY, NO_SCOPE, REVOKED, RATE, METHOD, LOADING, HYPIXEL_LIMIT, HYPIXEL_UNAVAILABLE, INTERNAL]
        profiles: { type: array, items: { type: string }, description: Для NO_PROFILE — какие профили есть }
        retryAfter: { type: integer, description: Для LOADING — через сколько секунд повторить }

    Version:
      type: object
      required: [api, build, core]
      properties:
        api: { type: string, example: 1.0.0 }
        build: { type: string, description: Версия сборки сайта }
        core: { type: [string, 'null'], description: Версия расчётов @sky-guide/core }

    Status:
      type: object
      required: [ok, load, at, hypixel, prices]
      properties:
        ok: { type: boolean }
        load: { type: string, enum: [low, medium, high] }
        why: { type: string }
        at: { type: integer, description: Время ответа, мс }
        hypixel:
          type: object
          properties:
            limitedUntil: { type: [integer, 'null'], description: До какого времени профили не обновляются из-за лимита Hypixel }
            daily: { type: boolean }
            keyBroken: { type: boolean }
        prices:
          type: object
          properties:
            bazaarAt: { type: [integer, 'null'], description: Когда обновились цены Bazaar, мс }
            auctionsAt: { type: [integer, 'null'], description: Когда закончился последний скан аукциона, мс }

    Rarity:
      type: [string, 'null']
      examples: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC, DIVINE, SPECIAL, VERY_SPECIAL]

    PriceInfo:
      type: [object, 'null']
      description: Цены Bazaar и аукциона (поля зависят от рынка)
      additionalProperties: true

    ItemCard:
      type: object
      required: [id, name]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        rarity: { $ref: '#/components/schemas/Rarity' }
        rarityRu: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        lore: { type: array, items: { type: string }, description: Описание как в игре (с цветовыми кодами §) }
        loreRu: { type: array, items: { type: string }, description: Описание в переводе (в английской версии — как в игре) }
        recipe: { type: [object, 'null'], additionalProperties: true }
        recipes: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        names: { type: object, additionalProperties: { type: string }, description: Названия ингредиентов рецептов по id }
        prices: { $ref: '#/components/schemas/PriceInfo' }
        npc: { type: [number, 'null'], description: Цена продажи NPC }
        priceId: { type: string, description: Id предмета на рынке }
        usedIn:
          type: array
          items:
            type: object
            properties: { id: { type: string }, name: { type: string } }
        props: { type: [object, 'null'], additionalProperties: true }
        obtainment: { type: [string, 'null'] }
        ru: { type: [object, 'null'], additionalProperties: true, description: Русская справка — описание, где взять, требования }

    ObtainGuide:
      type: object
      required: [id, name, methods]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        wiki:
          type: [object, 'null']
          properties:
            page: { type: [string, 'null'] }
            search: { type: [string, 'null'] }
        methods:
          type: array
          items:
            type: object
            required: [kind, title]
            additionalProperties: true
            properties:
              kind: { type: string, examples: [npc, craft, forge, kat, drop, bazaar, ah] }
              title: { type: string }
              total: { type: [number, 'null'], description: Сколько стоит этим способом }
              steps: { type: array, items: { type: object, additionalProperties: true } }

    SearchHit:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, description: Название как в игре }
        nameRu: { type: [string, 'null'] }
        rarity: { $ref: '#/components/schemas/Rarity' }
        type: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        price: { type: number, description: Цена сейчас (0 — нет на рынке) }
        close: { type: boolean, description: Только похоже по звучанию }

    DayChange:
      type: [object, 'null']
      description: Изменение за сутки, %
      properties:
        buy: { type: [number, 'null'] }
        sell: { type: [number, 'null'] }

    BazaarRow:
      type: object
      required: [id, name, buy, sell]
      additionalProperties: true
      properties:
        id: { type: string, description: Id на Bazaar }
        neuId: { type: string, description: Id в базе предметов, если отличается (INK_SACK:3 → INK_SACK-3) }
        name: { type: string }
        nameEn: { type: [string, 'null'] }
        buy: { type: number, description: Instant Buy — купить сразу }
        sell: { type: number, description: Instant Sell — продать сразу }
        spread: { type: number }
        buyVol: { type: number }
        sellVol: { type: number }
        buyWeek: { type: number, description: Куплено за неделю }
        sellWeek: { type: number, description: Продано за неделю }
        buyOrders: { type: number }
        sellOrders: { type: number }
        d1: { $ref: '#/components/schemas/DayChange' }
        cat: { type: [string, 'null'] }
        similar: { type: boolean, description: Найдено только по похожему названию }

    AuctionRow:
      type: object
      required: [id, name, price]
      additionalProperties: true
      properties:
        id: { type: string, description: 'Ключ предмета; варианты — ID@звёзды[r][+sN], питомцы — ID;редкость' }
        name: { type: string }
        nameEn: { type: [string, 'null'] }
        price: { type: number, description: Lowest BIN }
        second: { type: number, description: Второй по цене лот }
        count: { type: number, description: Лотов BIN сейчас }
        sold24: { type: number }
        sold7: { type: number }
        median: { type: number, description: Медиана продаж }
        last: { type: number }
        lastAt: { type: number }
        cat: { type: [string, 'null'] }
        rarity: { $ref: '#/components/schemas/Rarity' }
        d1: { type: [number, 'null', object] }
        max: { type: number, description: Lowest BIN питомца 100 уровня }
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              price: { type: number }
              count: { type: number }
              sold24: { type: number }
              median: { type: number }

    Facets:
      type: object
      description: Сколько найденного в каждой категории/редкости
      additionalProperties:
        type: object
        additionalProperties: { type: integer }

    Candles:
      type: object
      required: [id, name, tf, candles, hasMore]
      additionalProperties: true
      properties:
        id: { type: string }
        market: { type: string, enum: [ah] }
        name: { type: string }
        tf: { type: string }
        candles:
          type: array
          description: Свеча — массив [время мс, open, high, low, close, объём, …]
          items:
            type: array
            items: { type: [number, 'null'] }
        hasMore: { type: boolean, description: Есть свечи раньше — запроси с to }
        live: { type: [object, 'null'], additionalProperties: true, description: Цена прямо сейчас }
        variants: { type: array, items: { type: object, additionalProperties: true } }
        keep: { type: object, additionalProperties: { type: number }, description: Сколько хранится свечей этого размера, мс }

    Flip:
      type: object
      additionalProperties: true
      description: Флип; общие поля — id, name и прибыль. Остальное зависит от вида (ингредиенты, время Forge, NPC).
      properties:
        id: { type: string }
        name: { type: string }

    Lexicon:
      type: object
      required: [v, ready, phrases]
      properties:
        v: { type: number, description: Версия словаря (меняется с обновлением базы предметов) }
        ready: { type: boolean, description: false — база предметов ещё грузится, словарь неполный }
        phrases: { type: object, additionalProperties: { type: string } }

    News:
      type: object
      required: [latest, entries]
      properties:
        latest: { type: [string, 'null'] }
        entries:
          type: array
          items:
            type: object
            required: [id, date, kind, title, items]
            properties:
              id: { type: string }
              date: { type: string, format: date }
              kind: { type: string, enum: [new, better, fix] }
              kindRu: { type: string }
              title: { type: string }
              items: { type: array, items: { type: string } }

    PlayerRef:
      type: object
      required: [name]
      properties:
        name: { type: [string, 'null'] }
        uuid: { type: [string, 'null'] }

    PlayerProfiles:
      type: object
      required: [player, profiles]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profiles:
          type: array
          items:
            type: object
            required: [id, name, selected, mode, members]
            properties:
              id: { type: string }
              name: { type: string }
              selected: { type: boolean, description: Игрок сейчас играет в этом профиле }
              mode: { type: string, examples: [normal, ironman, island, bingo] }
              members: { type: integer, description: Участников коопа }

    Level:
      type: object
      additionalProperties: true
      properties:
        name: { type: [string, 'null'] }
        level: { type: number }
        maxLevel: { type: number }
        progress: { type: number }
        xp: { type: number }

    Summary:
      type: object
      required: [player, profile, skills, slayers, dungeons]
      additionalProperties: true
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        profileId: { type: [string, 'null'] }
        gameMode: { type: [string, 'null'] }
        coop: { type: integer, description: Участников коопа }
        updatedAt: { type: number }
        sbLevel: { type: number }
        networth: { type: [object, 'null'], additionalProperties: { type: number } }
        purse: { type: number }
        bank: { type: [number, 'null'] }
        skillAverage: { type: number }
        skills: { type: object, additionalProperties: { $ref: '#/components/schemas/Level' } }
        slayers: { type: object, additionalProperties: { $ref: '#/components/schemas/Level' } }
        dungeons: { type: object, additionalProperties: true }
        accessories: { type: object, additionalProperties: true }
        mining: { type: object, additionalProperties: true }
        garden: { type: object, additionalProperties: true }
        pets: { type: object, additionalProperties: true }
        gear: { type: object, additionalProperties: true }
        next:
          type: array
          description: Первые шаги плана
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              cat: { type: string }

    Step:
      type: object
      required: [id, cat, priority, title, why, how]
      properties:
        id: { type: string, description: Стабильный id шага }
        cat: { type: string, description: Раздел (Dungeons, Аксессуары, Заработок…) }
        priority: { type: number, minimum: 0, maximum: 100, description: Важность, больше — важнее }
        effort: { type: [string, 'null'], description: Сколько времени займёт }
        title: { type: string }
        why: { type: string, description: Зачем и что даст }
        how: { type: array, items: { type: string }, description: Как сделать и где взять }
        items: { type: array, items: { type: string }, description: SkyBlock ID нужных предметов }
        cost: { type: [number, 'null'], description: Оценка затрат в монетах }
        payoff: { type: [string, 'null'] }
        needsSaving: { type: boolean, description: Не хватает монет, нужно накопить }
        link: { type: [string, 'null'], description: Раздел сайта }

    Plan:
      type: object
      required: [player, profile, updatedAt, steps]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        updatedAt: { type: number }
        steps: { type: array, items: { $ref: '#/components/schemas/Step' } }

    Money:
      type: object
      required: [player, profile, updatedAt, methods]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        updatedAt: { type: number }
        plan: { description: Что делать ради денег по порядку, additionalProperties: true }
        methods:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              title: { type: string }

    Accessories:
      type: object
      required: [player, profile, updatedAt, magicalPower, count, steps, owned]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        updatedAt: { type: number }
        magicalPower: { type: integer, description: Magical Power по сумке сейчас }
        highestMagicalPower: { type: [integer, 'null'], description: Наибольший Magical Power, который видел Hypixel }
        count: { type: integer, description: Аксессуаров в сумке }
        missing: { type: integer, description: Сколько аксессуаров ещё нет (все версии) }
        recomb:
          type: object
          properties:
            left: { type: integer, description: Аксессуаров без Recombobulator, где он даёт MP }
            mp: { type: number, description: Сколько MP дадут все Recombobulator }
            price: { type: [integer, 'null'] }
        enrichPrice: { type: [integer, 'null'], description: Цена Accessory Enrichment }
        steps:
          type: array
          description: Что сделать дальше — дешевле за 1 MP первыми
          items:
            type: object
            required: [kind, id, mp]
            properties:
              kind: { type: string, enum: [buy, tier, recomb, enrich], description: 'Купить, следующий tier, Recombobulator, Enrichment' }
              id: { type: string, description: SkyBlock ID (для tier — свой аксессуар) }
              target: { type: [string, 'null'], description: Для tier — во что улучшить }
              name: { type: [string, 'null'] }
              rarity: { $ref: '#/components/schemas/Rarity' }
              mp: { type: number }
              cost: { type: [integer, 'null'] }
              perMp: { type: [integer, 'null'] }
        owned:
          type: array
          items:
            type: object
            required: [id, name, mp, active]
            properties:
              id: { type: string }
              name: { type: string }
              rarity: { $ref: '#/components/schemas/Rarity' }
              mp: { type: number }
              active: { type: boolean, description: Даёт MP (старшая версия линейки в сумке его перекрывает) }
              recomb: { type: boolean }
              reforge: { type: [string, 'null'] }
              enrichment: { type: [string, 'null'] }
              next: { type: [string, 'null'], description: Следующий tier линейки }
              canRecomb: { type: boolean }
              value: { type: integer }

    MissingAccessories:
      type: object
      required: [player, profile, updatedAt, all, total, items]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        updatedAt: { type: number }
        magicalPower: { type: integer }
        all: { type: integer, description: Недостающих линеек без фильтров }
        total:
          type: object
          description: Итог по списку после фильтров (до limit)
          properties:
            count: { type: integer }
            mp: { type: number, description: Сколько MP дадут все }
            price: { type: integer, description: Сколько стоят все с ценой }
            unpriced: { type: integer, description: Сколько без цены на рынке }
        items:
          type: array
          items:
            type: object
            required: [id, name, mp, price, how, where]
            properties:
              id: { type: string }
              name: { type: string }
              rarity: { $ref: '#/components/schemas/Rarity' }
              mp: { type: number, description: Сколько Magical Power прибавит }
              price: { type: [integer, 'null'], description: 'Цена; для апгрейда — доплата за вычетом своей версии' }
              perMp: { type: [integer, 'null'], description: Монет за 1 MP }
              upgradeFrom: { type: [string, 'null'], description: Своя младшая версия, если это апгрейд }
              tier: { type: [array, 'null'], items: { type: integer }, description: '[место в линейке, всего]' }
              stat: { type: [string, 'null'], description: Главный стат }
              how: { type: [string, 'null'], enum: [npc, craft, drop, da, bazaar, ah, null], description: 'Как получить: NPC, крафт, дроп, Dark Auction, Bazaar, аукцион' }
              howText: { type: [string, 'null'] }
              req: { type: [string, 'null'], description: Невыполненное требование рецепта }
              where:
                type: array
                description: Где взять (до 3 способов)
                items:
                  type: object
                  required: [text]
                  properties:
                    text: { type: string }
                    coins: { type: [integer, 'null'], description: Цена способа в монетах, если считается }

    MyAuctions:
      type: object
      required: [player, profile, at, listings, bids, summary, bazaar]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        at: { type: number, description: 'Когда лоты получены от Hypixel (мс)' }
        scanAt: { type: [number, 'null'], description: 'Когда был последний скан аукциона (ставки и цены)' }
        error: { type: [string, 'null'], description: 'Hypixel не ответил — показаны последние полученные лоты' }
        errorCode: { type: [string, 'null'] }
        bazaar: { type: boolean, const: false, description: 'Ордеров Bazaar в API Hypixel нет' }
        listings:
          type: array
          items:
            type: object
            required: [id, name, status, bin, price, end]
            properties:
              id: { type: string }
              name: { type: string }
              tier: { type: [string, 'null'] }
              key: { type: [string, 'null'], description: 'Ключ предмета для цен' }
              count: { type: integer }
              bin: { type: boolean }
              status: { type: string, enum: [sold, expired, active] }
              start: { type: number }
              end: { type: number }
              price: { type: number, description: 'Цена BIN или текущая ставка' }
              bids: { type: integer }
              coins: { type: number, description: 'Сколько монет забрать (sold)' }
              cheapest: { type: boolean, description: 'Самый дешёвый BIN этого предмета' }
              next: { type: number, description: 'Цена следующего по дешевизне лота' }
              undercut: { type: number, description: 'На сколько дешевле самый дешёвый чужой лот' }
              lowest: { type: number, description: 'Цена самого дешёвого чужого лота' }
        bids:
          type: array
          items:
            type: object
            required: [id, name, status, mine, top, end]
            properties:
              id: { type: string }
              key: { type: [string, 'null'], description: 'Ключ предмета для цен и картинки' }
              name: { type: string }
              tier: { type: [string, 'null'] }
              end: { type: number }
              mine: { type: number }
              top: { type: number }
              bids: { type: integer }
              status: { type: string, enum: [leading, outbid] }
        summary:
          type: object
          properties:
            coins: { type: number }
            sold: { type: integer }
            expired: { type: integer }
            active: { type: integer }
            undercut: { type: integer }
            outbid: { type: integer }
            bids: { type: integer }
    Networth:
      type: object
      required: [player, profile, updatedAt, networth, topItems, topPets]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        updatedAt: { type: number }
        networth:
          type: object
          required: [total]
          additionalProperties: { type: integer }
          properties:
            total: { type: integer }
            items: { type: integer }
            pets: { type: integer }
            sacks: { type: integer }
            essence: { type: integer }
            museum: { type: integer }
            coins: { type: integer }
            cosmetic: { type: integer, description: 'Сколько из total дают скины и краски (на предметах, в музее и у питомцев). Уже входит в total.' }
        purse: { type: integer }
        bank: { type: [integer, 'null'] }
        topItems:
          type: array
          items:
            type: object
            required: [id, name, value]
            properties:
              id: { type: string }
              name: { type: string }
              rarity: { $ref: '#/components/schemas/Rarity' }
              value: { type: integer }
              where: { type: [string, 'null'], description: 'Где лежит: Inventory, Ender Chest, Wardrobe…' }
        topPets:
          type: array
          items:
            type: object
            required: [id, type, level, value]
            properties:
              id: { type: string }
              type: { type: string }
              tier: { type: [string, 'null'] }
              level: { type: number }
              heldItem: { type: [string, 'null'] }
              value: { type: integer }

    ItemUpgrades:
      type: object
      required: [player, profile, updatedAt, id, copies]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        updatedAt: { type: number }
        id: { type: string }
        copies:
          type: array
          items:
            type: object
            required: [uuid, where, name, value, plan]
            additionalProperties: true
            properties:
              uuid: { type: string }
              where: { type: string, description: Где лежит экземпляр }
              name: { type: string }
              rarity: { type: [string, 'null'] }
              value: { type: number, description: Оценка с улучшениями }
              recomb: { type: boolean }
              market: { type: [object, 'null'], additionalProperties: true, description: Похожие лоты аукциона (те же звёзды и Recombobulator) }
              family: { type: [object, 'null'], additionalProperties: true, description: Для аксессуара — линейка и дубли в сумке }
              plan: { type: object, additionalProperties: true, description: Чек-лист улучшений с ценами }

    Compare:
      type: object
      required: [players, at]
      properties:
        at: { type: number }
        players:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Summary'
              - type: object
                required: [query, error, code]
                properties:
                  query: { type: object, properties: { player: { type: string }, profile: { type: string } } }
                  error: { type: string }
                  code: { type: string }

    Section:
      type: object
      additionalProperties: true
      description: Ответ раздела сайта — те же поля, что получает страница этого раздела.

    GuideList:
      type: object
      required: [groups, guides]
      properties:
        groups: { description: Группы гайдов }
        guest: { type: boolean }
        guides:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              title: { type: string }

    Leaderboard:
      type: object
      required: [boards, mode]
      additionalProperties: true
      properties:
        mode: { type: string }
        tracked: { type: integer, description: Сколько игроков в таблицах }
        boards:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }

    Trend:
      type: object
      required: [id, market]
      additionalProperties: true
      properties:
        id: { type: string }
        market: { type: [string, 'null'], examples: [Bazaar, Auction House] }
        now: { type: number }
        d1: { type: [number, 'null'], description: 'Изменение за сутки, %' }
        d7: { type: [number, 'null'], description: 'Изменение за неделю, %' }
        label: { type: string }

    Movers:
      type: object
      required: [up, down]
      properties:
        up: { type: array, items: { type: object, additionalProperties: true } }
        down: { type: array, items: { type: object, additionalProperties: true } }

    History:
      type: object
      required: [player, profile, range, points, tracked]
      properties:
        player: { $ref: '#/components/schemas/PlayerRef' }
        profile: { type: [string, 'null'] }
        range: { type: string }
        since: { type: [number, 'null'] }
        tracked: { type: boolean, description: Сайт копит историю этого профиля }
        points: { type: array, items: { type: object, additionalProperties: true, properties: { t: { type: number } } } }
